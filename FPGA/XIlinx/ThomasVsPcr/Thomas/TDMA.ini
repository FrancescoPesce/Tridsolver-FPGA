kernel_frequency=0:300

[connectivity]
# Every argument on 4 HBM banks (1 GiB): EvoNano keeps the three sweeps of a 256^3 grid with
# 5 substrates on the device, 960 MiB per argument.
sp=TDMA_batch_1.a:HBM[0:3]
sp=TDMA_batch_1.b:HBM[4:7]
sp=TDMA_batch_1.c:HBM[8:11]
sp=TDMA_batch_1.d:HBM[12:15]
sp=TDMA_batch_1.u:HBM[16:19]


slr=TDMA_batch_1:SLR0
